name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:ui
      - run: pnpm check:secrets
      - run: pnpm check:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks also checks the history, so a secret removed in a later commit still counts.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Secrets in the repository and its history
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.21.2 git --redact --verbose /repo
