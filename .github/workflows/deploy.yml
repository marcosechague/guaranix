# Deploys one environment: migrations, bootstrap, the API Worker and the gateway
# Worker that serves the three apps. Called by deploy-production.yml (a staging
# caller can be added later); runbook in docs/despliegue.md.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Wrangler environment (production)
        required: true
        type: string
      ref:
        description: Commit to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.urls.outputs.origin }}
    # Never two deploys of the same environment at once; a newer one waits.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check that the environment is set up
        id: ready
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$DATABASE_URL" ] || missing+=(DATABASE_URL)
          [ -n "$HYPERDRIVE_ID" ] || missing+=(HYPERDRIVE_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            # Until Marcos sets up the environment, merges to main stay green.
            echo "::warning::Environment '${{ inputs.environment }}' not set up yet (missing: ${missing[*]}). Skipping deploy; see docs/despliegue.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$HYPERDRIVE_ID" ] && ! [[ "$HYPERDRIVE_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::HYPERDRIVE_ID must be the 32-character id from the setup workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Public URL
        id: urls
        if: steps.ready.outputs.ok == 'true'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          pnpm check:deploy
          origin=$(node scripts/deploy/public-url.mjs)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Public URL: $origin"

      # Migrations first: the new code may need the new columns, and every
      # migration keeps the previous Worker version working (expand, then contract).
      - name: Database migrations
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Platform plans and admin
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_ADMIN_EMAIL: ${{ vars.PLATFORM_ADMIN_EMAIL }}
        run: pnpm --filter @guaranix/db db:bootstrap

      # Before the gateway: its service binding needs the API Worker to exist.
      - name: Deploy API
        if: steps.ready.outputs.ok == 'true'
        working-directory: apps/api
        env:
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
          GITHUB_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_VARS: ${{ toJSON(vars) }}
          ORIGIN: ${{ steps.urls.outputs.origin }}
        run: |
          secrets_file="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node ../../scripts/deploy/write-secrets-file.mjs "$secrets_file"
          sed -i "s/\"id\": \"HYPERDRIVE_ID\"/\"id\": \"$HYPERDRIVE_ID\"/" wrangler.jsonc
          pnpm exec wrangler deploy --env '${{ inputs.environment }}' \
            --secrets-file "$secrets_file" \
            --var "ALLOWED_ORIGINS:$ORIGIN" \
            --var "PUBLIC_API_URL:$ORIGIN/api" \
            --var "ADMIN_APP_URL:$ORIGIN/panel" \
            --var "MEMBER_APP_URL:$ORIGIN"

      - name: Build the apps and deploy the gateway
        if: steps.ready.outputs.ok == 'true'
        env:
          VITE_API_URL: ${{ steps.urls.outputs.origin }}/api
          VITE_ADMIN_URL: ${{ steps.urls.outputs.origin }}/panel/
          VITE_PLATFORM_URL: ${{ steps.urls.outputs.origin }}/plataforma/
        run: |
          pnpm --filter @guaranix/member build
          APP_BASE_PATH=/panel/ pnpm --filter @guaranix/admin build
          APP_BASE_PATH=/plataforma/ pnpm --filter @guaranix/platform build
          node scripts/deploy/assemble-site.mjs
          node scripts/deploy/write-headers.mjs apps/gateway/dist
          (cd apps/gateway && ../api/node_modules/.bin/wrangler deploy --env '${{ inputs.environment }}')

      - name: Telegram webhook
        if: steps.ready.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          API_URL: ${{ steps.urls.outputs.origin }}/api
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "Telegram not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${API_URL}/integrations/telegram/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]'
          echo "Telegram webhook set."

      - name: Smoke test
        if: steps.ready.outputs.ok == 'true'
        env:
          ORIGIN: ${{ steps.urls.outputs.origin }}
        run: |
          # A new workers.dev address can take a minute to answer.
          check() {
            for attempt in $(seq 1 20); do
              if body=$(curl --fail --silent --show-error --max-time 10 "$1") &&
                printf '%s' "$body" | grep -q "$2"; then
                echo "OK $1"
                return 0
              fi
              sleep 15
            done
            echo "::error::$1 did not answer as expected"
            return 1
          }
          check "$ORIGIN/api/health" '"environment":"${{ inputs.environment }}"'
          check "$ORIGIN/" '<div id="root">'
          check "$ORIGIN/panel/" '/panel/assets/'
          check "$ORIGIN/panel/alumnos" '/panel/assets/'
          check "$ORIGIN/plataforma/" '/plataforma/assets/'
          {
            echo "### ${{ inputs.environment }} publicado"
            echo "- Alumnos: $ORIGIN/"
            echo "- Panel del box: $ORIGIN/panel/"
            echo "- Plataforma: $ORIGIN/plataforma/"
            echo "- API: $ORIGIN/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
