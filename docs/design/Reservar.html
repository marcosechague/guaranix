<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reservar clase</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D9F24A}a:hover{color:#ECFF7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Reservar</span>
<span style="font-size: 14px; color: #A3A69E">Plan ilimitado · reservá cuando quieras</span>
</div>

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="6">
<button onClick="{{ d.pick }}" style="{{d.style}}">
<span style="font-size: 11px; font-weight: 600">{{d.dow}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{d.num}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; gap: 8px">
<span style="font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 99px; background: #F4F5F2; color: #0E0F11">Todos</span>
<span style="font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 99px; border: 1px solid #2A2C30; color: #C9CCC3">CrossFit</span>
<span style="font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 99px; border: 1px solid #2A2C30; color: #C9CCC3">Open Box</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{classes}}" as="c" hint-placeholder-count="6">
<div style="background: #17181B; border: 1px solid {{c.border}}; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; width: 64px">{{c.time}}</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 64px; height: 4px; border-radius: 2px; background: #2A2C30; overflow: hidden"><div style="{{c.bar}}"></div></div>
<span style="font-size: 12px; color: #A3A69E">{{c.spots}}</span>
</div>
</div>
<button onClick="{{ c.toggle }}" style="{{c.btnStyle}}">{{c.btn}}</button>
</div>
</sc-for>
</div>
</div>

<nav style="height: 76px; border-top: 1px solid #2A2C30; background: #121316; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>Inicio</a>
<a href="Reservar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #D9F24A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Reservar</a>
<a href="Wod.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"></path></svg>WOD</a>
<a href="Wod.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Progreso</a>
<a href="Cuota.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0, booked: { '19:00': true } };
  }
  renderVals() {
    const lime = '#D9F24A';
    const dayList = [['VIE','27'],['SÁB','28'],['LUN','30'],['MAR','1'],['MIÉ','2'],['JUE','3']];
    const days = dayList.map(([dow, num], i) => {
      const on = this.state.day === i;
      return {
        dow, num,
        pick: () => this.setState({ day: i }),
        style: 'height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Inter, sans-serif; ' + (on ? 'background: ' + lime + '; color: #0E0F11; border: 1px solid ' + lime : 'background: #17181B; color: #F4F5F2; border: 1px solid #2A2C30')
      };
    });
    const list = [['06:00','CrossFit',8],['07:00','CrossFit',20],['08:00','CrossFit',5],['10:00','Open Box · 2 h',3],['18:00','CrossFit',17],['19:00','CrossFit',14]];
    const classes = list.map(([time, name, n]) => {
      const mine = !!this.state.booked[time];
      const full = n >= 20 && !mine;
      const pct = Math.round(n / 20 * 100);
      return {
        time, name,
        spots: full ? 'Llena · lista de espera' : (20 - n) + ' lugares libres',
        bar: 'height: 4px; width: ' + pct + '%; background: ' + (full ? '#FF8A5B' : lime),
        border: mine ? lime : '#2A2C30',
        btn: mine ? 'Reservada' : (full ? 'Esperar' : 'Reservar'),
        btnStyle: 'height: 44px; min-width: 104px; padding: 0 14px; border-radius: 12px; font-weight: 600; font-size: 14px; font-family: Inter, sans-serif; ' + (mine ? 'background: transparent; color: ' + lime + '; border: 1px solid ' + lime : 'background: #F4F5F2; color: #0E0F11; border: 0'),
        toggle: () => this.setState({ booked: { ...this.state.booked, [time]: !mine } })
      };
    });
    return { days, classes };
  }
}
</script>
</body>
</html>
