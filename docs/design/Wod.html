<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>WOD y resultado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D9F24A}a:hover{color:#ECFF7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F11; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A3A69E">VIERNES 27 · CROSSFIT</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1">Asunción Heat</span>
</div>

<div style="display: flex; gap: 8px">
<span style="font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: #2A2C30; color: #F4F5F2">For time</span>
<span style="font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: #2A2C30; color: #F4F5F2">Cap 15:00</span>
<span style="font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: #2A2C30; color: #F4F5F2">Rx 43/30 kg</span>
</div>

<div style="background: #17181B; border: 1px solid #2A2C30; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #D9F24A; width: 72px">21-15-9</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">Thrusters</span>
<span style="font-size: 16px; font-weight: 600">Pull-ups</span>
</div>
</div>
<div style="height: 1px; background: #2A2C30"></div>
<div style="display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #D9F24A; width: 72px">400 m</span>
<span style="font-size: 16px; font-weight: 600">Run de cierre</span>
</div>
<div style="font-size: 13px; color: #A3A69E; line-height: 1.5">Escalado: thrusters 30/20 kg y ring rows. Pedile al coach si dudás.</div>
</div>

<button onClick="{{ toggleTimer }}" style="height: 72px; border-radius: 18px; border: 0; background: #D9F24A; color: #0E0F11; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: Inter, sans-serif">
<span style="font-size: 15px; font-weight: 700">{{timerLabel}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">{{clock}}</span>
</button>

<div style="background: #17181B; border: 1px solid #2A2C30; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A3A69E">TU RESULTADO</span>
<div style="display: flex; align-items: center; gap: 10px">
<label for="res" style="position: absolute; left: -9999px">Tiempo</label>
<input id="res" value="09:42" style="flex: 1; min-width: 0; height: 56px; border-radius: 12px; border: 1px solid #2A2C30; background: #0E0F11; color: #F4F5F2; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; padding: 0 14px; box-sizing: border-box">
<div style="display: flex; border: 1px solid #2A2C30; border-radius: 12px; overflow: hidden">
<button onClick="{{ setRx }}" style="{{rxStyle}}">Rx</button>
<button onClick="{{ setSc }}" style="{{scStyle}}">Esc.</button>
</div>
</div>
<button style="height: 48px; border-radius: 12px; border: 0; background: #F4F5F2; color: #0E0F11; font-weight: 700; font-size: 15px; font-family: Inter, sans-serif">Guardar resultado</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A3A69E">PIZARRA DE HOY</span>
<sc-for list="{{board}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px">
<span style="width: 20px; color: #A3A69E; font-weight: 600">{{r.pos}}</span>
<span style="flex: 1; font-weight: 600">{{r.name}}</span>
<span style="font-size: 12px; color: #A3A69E">{{r.cat}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; width: 52px; text-align: right">{{r.time}}</span>
</div>
</sc-for>
</div>
</div>

<nav style="height: 76px; border-top: 1px solid #2A2C30; background: #121316; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>Inicio</a>
<a href="Reservar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Reservar</a>
<a href="Wod.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #D9F24A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"></path></svg>WOD</a>
<a href="Wod.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Progreso</a>
<a href="Cuota.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A69E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: 0, running: false, rx: true };
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state.secs;
    const clock = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    const on = 'height: 56px; padding: 0 14px; border: 0; background: #D9F24A; color: #0E0F11; font-weight: 700; font-family: Inter, sans-serif; font-size: 14px';
    const off = 'height: 56px; padding: 0 14px; border: 0; background: transparent; color: #C9CCC3; font-weight: 700; font-family: Inter, sans-serif; font-size: 14px';
    return {
      clock,
      timerLabel: this.state.running ? 'Pausar timer' : (s ? 'Seguir' : 'Iniciar timer'),
      toggleTimer: () => {
        if (this.state.running) { clearInterval(this.t); this.setState({ running: false }); }
        else { this.t = setInterval(() => this.setState({ secs: this.state.secs + 1 }), 1000); this.setState({ running: true }); }
      },
      rxStyle: this.state.rx ? on : off,
      scStyle: this.state.rx ? off : on,
      setRx: () => this.setState({ rx: true }),
      setSc: () => this.setState({ rx: false }),
      board: [
        { pos: '1', name: 'Lucía B.', cat: 'Rx', time: '07:58' },
        { pos: '2', name: 'Juan L.', cat: 'Rx', time: '08:31' },
        { pos: '3', name: 'Diego L.', cat: 'Esc.', time: '09:10' }
      ]
    };
  }
}
</script>
</body>
</html>
