<!doctype html>
<html lang="es-PY" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F5F2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>GuaraniX · Box</title>
    <script>
      // Theme before the first paint (see THEME_STORAGE_KEY in @guaranix/ui): stored choice, else the system's.
      try {
        var stored = localStorage.getItem('gx-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
