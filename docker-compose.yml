# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
# Production uses Neon Postgres through Cloudflare Hyperdrive; this mirrors its major version.
services:
  postgres:
    image: postgres:17-alpine
    container_name: guaranix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guaranix
      POSTGRES_PASSWORD: guaranix
      POSTGRES_DB: guaranix
      TZ: America/Asuncion
    ports:
      - '${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guaranix -d guaranix']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
